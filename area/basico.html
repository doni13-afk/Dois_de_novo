<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protocolo dos 21 Encontros — Área de Membros</title>
<style>
:root{--ink:#2b121d;--paper:#fbf8f2;--cream:#f3ece5;--gold:#e6b85c;--gold-light:#f6d4a2;--coral:#df6548;--coral-dark:#914a35;--display:"Instrument Serif",Georgia,serif;--body:"DM Sans",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
.topbar{position:sticky;top:0;z-index:100;background:linear-gradient(120deg,#2b121d,#3b1c29);color:var(--paper);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid rgba(230,184,92,.2)}
.topbar-brand{font-family:var(--display);font-size:22px;color:var(--gold-light)}
.topbar-brand span{color:var(--coral)}
.topbar-right{display:flex;align-items:center;gap:16px;font-size:13px;color:#c9b6a6}
.topbar-progress{display:flex;align-items:center;gap:8px}
.progress-mini{width:120px;height:6px;background:rgba(230,184,92,.2);border-radius:99px;overflow:hidden}
.progress-mini-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:99px;transition:width .4s}
.topbar-menu-btn{display:none;background:rgba(230,184,92,.15);border:1px solid rgba(230,184,92,.4);border-radius:8px;padding:8px 12px;color:var(--gold-light);font-size:13px;font-weight:600}
.app{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 60px)}
.sidebar{background:var(--ink);color:var(--paper);padding:24px 0;border-right:1px solid rgba(230,184,92,.15);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sidebar-header{padding:0 20px 20px;border-bottom:1px solid rgba(230,184,92,.15);margin-bottom:20px}
.sidebar-header h3{font-family:var(--display);font-size:20px;font-weight:400;color:var(--gold-light);margin-bottom:6px}
.sidebar-header p{font-size:12px;color:#a893a0}
.sidebar-section{padding:0 20px;margin-bottom:24px}
.sidebar-section h4{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;color:#e8d9cb;cursor:pointer;transition:background .15s;margin-bottom:2px;border:0;background:none;width:100%;text-align:left}
.sidebar-item:hover{background:rgba(230,184,92,.1)}
.sidebar-item.active{background:rgba(230,184,92,.18);color:var(--gold-light);font-weight:600}
.sidebar-item.done{opacity:.75}
.sidebar-item .num{font-family:var(--display);font-size:16px;width:26px;flex:none;color:var(--gold)}
.sidebar-item.done .num::after{content:"✓";color:var(--coral);font-size:14px;font-family:var(--body);font-weight:700}
.sidebar-item.done .num-text{display:none}
.sidebar-divider{height:1px;background:rgba(230,184,92,.15);margin:16px 20px}
.main{padding:36px 32px 80px;max-width:900px}
.content{background:#fff;border:1px solid rgba(24,15,27,.08);border-radius:20px;padding:40px;box-shadow:0 12px 32px rgba(74,26,48,.06)}
.dash-hero{text-align:center;margin-bottom:32px}
.dash-hero h1{font-family:var(--display);font-size:clamp(28px,4vw,42px);font-weight:400;line-height:1.15;margin-bottom:10px}
.dash-hero h1 em{color:var(--coral-dark);font-style:italic}
.dash-hero p{color:#6b5560;font-size:16px;max-width:560px;margin:0 auto}
.dash-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--coral-dark);background:rgba(230,184,92,.2);padding:6px 14px;border-radius:99px;margin-bottom:16px}
.dash-progress{background:linear-gradient(145deg,#fffaf1,#f3ece5);border:1px solid rgba(230,184,92,.4);border-radius:16px;padding:24px;margin:28px 0;text-align:center}
.dash-progress .big{font-family:var(--display);font-size:48px;line-height:1;color:var(--coral-dark);font-weight:400;margin-bottom:8px}
.dash-progress .big small{font-size:20px;color:#8a7480}
.dash-progress .label{font-size:14px;color:#6b5560;margin-bottom:16px}
.dash-bar{height:12px;background:rgba(24,15,27,.08);border-radius:99px;overflow:hidden;max-width:400px;margin:0 auto}
.dash-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:99px;transition:width .6s}
.dash-continue{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:linear-gradient(165deg,#ffe09b,#ebbc60 40%,#d89a34);color:#291b0c;font-weight:700;font-size:15px;padding:14px 28px;border-radius:12px;border:1px solid #fff0c4;border-bottom:3px solid #9f6621;box-shadow:0 6px 18px rgba(22,6,14,.2);transition:transform .18s}
.dash-continue:hover{transform:translateY(-2px)}
.phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.phase-card{background:#fff;border:1px solid rgba(24,15,27,.08);border-radius:14px;padding:20px;text-align:center}
.phase-card .phase-num{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--coral-dark);margin-bottom:6px}
.phase-card h4{font-family:var(--display);font-size:20px;font-weight:400;margin-bottom:6px}
.phase-card p{font-size:13px;color:#7a5f6a;line-height:1.5}
.phase-card .phase-progress{margin-top:12px;font-size:12px;color:var(--coral-dark);font-weight:600}
.day-header{margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid rgba(24,15,27,.1)}
.day-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-dark);margin-bottom:8px}
.day-header h1{font-family:var(--display);font-size:clamp(28px,4vw,40px);font-weight:400;line-height:1.15;margin-bottom:12px}
.day-header .day-lead{font-size:17px;color:#4a3540;line-height:1.6}
.section-block{margin-bottom:32px}
.section-block h2{font-family:var(--display);font-size:26px;font-weight:400;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.section-block h2 .block-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--coral));display:grid;place-items:center;font-size:18px;flex:none}
.section-block .content-text{font-size:16px;line-height:1.75;color:#3b1c29}
.section-block .content-text p{margin-bottom:14px}
.section-block .content-text p:last-child{margin-bottom:0}
.section-block .content-text strong{color:var(--coral-dark)}
.practice-box{background:#fffaf1;border:2px solid var(--gold);border-radius:16px;padding:24px;margin-top:8px}
.practice-box .practice-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-dark);margin-bottom:12px}
.practice-box h3{font-family:var(--display);font-size:22px;font-weight:400;margin-bottom:12px;line-height:1.2}
.practice-box ol,.practice-box ul{padding-left:22px;margin-bottom:14px}
.practice-box li{padding:6px 0;font-size:15px;line-height:1.6}
.practice-box .practice-note{font-size:14px;color:#7a5f6a;font-style:italic;padding-top:12px;border-top:1px dashed rgba(24,15,27,.15)}
.day-actions{display:flex;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid rgba(24,15,27,.1);flex-wrap:wrap}
.btn-done{background:linear-gradient(165deg,#ffe09b,#ebbc60 40%,#d89a34);color:#291b0c;font-weight:700;font-size:15px;padding:14px 28px;border-radius:12px;border:1px solid #fff0c4;border-bottom:3px solid #9f6621;box-shadow:0 6px 18px rgba(22,6,14,.2);transition:transform .18s;flex:1;min-width:200px;cursor:pointer}
.btn-done:hover{transform:translateY(-2px)}
.btn-done.completed{background:linear-gradient(165deg,#a8d5a8,#7fb87f 40%,#5a9a5a);border-color:#c8e8c8;border-bottom-color:#3a7a3a}
.btn-nav{background:#fff;border:1px solid rgba(24,15,27,.15);color:var(--ink);font-weight:600;font-size:14px;padding:14px 20px;border-radius:12px;transition:background .15s;cursor:pointer}
.btn-nav:hover{background:#f3ece5}
.btn-nav:disabled{opacity:.4;cursor:not-allowed}
.error-box{padding:40px;background:#fff;border-radius:16px;max-width:600px;margin:40px auto;text-align:center;font-family:sans-serif}
.error-box h2{color:#2b121d;margin-bottom:16px;font-size:24px}
.error-box p{color:#666;margin-bottom:12px;font-size:14px;line-height:1.6}
.error-box button{margin-top:20px;padding:12px 24px;background:#e6b85c;border:0;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:60px;left:0;right:0;bottom:0;z-index:99;height:auto;transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .topbar-menu-btn{display:block}
  .main{padding:24px 16px 80px}
  .content{padding:24px 18px;border-radius:16px}
  .phase-grid{grid-template-columns:1fr}
  .day-actions{flex-direction:column}
  .btn-done{width:100%}
  .day-header h1{font-size:26px}
  .section-block h2{font-size:22px}
}
@media(max-width:600px){
  body{font-size:16px}
  .topbar{padding:12px 16px}
  .topbar-brand{font-size:19px}
  .dash-hero h1{font-size:26px}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <div style="display:flex;align-items:center;gap:16px">
    <button class="topbar-menu-btn" id="menuBtn">☰ Dias</button>
    <a href="#" class="topbar-brand" onclick="showView('dashboard');return false;">Dois <span>de</span> Novo</a>
  </div>
  <div class="topbar-right">
    <div class="topbar-progress">
      <span id="topProgressText">0/21</span>
      <div class="progress-mini"><div class="progress-mini-fill" id="topProgressFill"></div></div>
    </div>
  </div>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>Seu Protocolo</h3>
      <p>21 encontros · 3 fases</p>
    </div>
    <div class="sidebar-section">
      <h4>Início</h4>
      <button class="sidebar-item" onclick="showView('dashboard')">📊 Meu progresso</button>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section"><h4>Fase 1 — Presença</h4><div id="sidebarFase1"></div></div>
    <div class="sidebar-section"><h4>Fase 2 — Diálogo</h4><div id="sidebarFase2"></div></div>
    <div class="sidebar-section"><h4>Fase 3 — Carinho</h4><div id="sidebarFase3"></div></div>
  </aside>
  <main class="main" id="mainContent"></main>
</div>

<script>
var progress = {};
try {
  var stored = localStorage.getItem('protocolo21_progress_basic');
  if (stored) progress = JSON.parse(stored) || {};
} catch (e) { progress = {}; }

var currentView = 'dashboard';
var currentViewDay = 1;

function saveProgress(){ try { localStorage.setItem('protocolo21_progress_basic', JSON.stringify(progress)); } catch(e){} }

var PHASES = { 1: {name: "Presença"}, 2: {name: "Diálogo"}, 3: {name: "Carinho"} };

var DAYS = [
  {day:1,phase:1,title:"O primeiro encontro",lead:"Hoje começa o seu protocolo. E o primeiro passo não é fazer nada — é perceber o que você perdeu.",lesson:"<p>Antes de mudar qualquer coisa, você precisa <strong>ver com clareza o que está acontecendo</strong>. Não com culpa, não com raiva. Com honestidade.</p><p>Quando foi a última vez que vocês fizeram algo juntos que não envolvesse celular, TV ou filhos? Quando foi a última vez que vocês riram de verdade, um do outro?</p><p>Não é sobre acusar. É sobre reconhecer. O tempo que era de vocês foi sendo ocupado por tudo o mais — e isso não aconteceu de uma vez. Aconteceu em pequenas ausências.</p><p><strong>O primeiro encontro é o encontro com a verdade.</strong> Hoje, você não vai fazer nada com ele. Vai apenas perceber.</p>",practice:{title:"O exercício de hoje",steps:["Pegue um caderno ou o bloco de notas do celular.","Escreva: 'O que eu sinto falta na nossa rotina é...' — e complete com 3 coisas concretas.","Não mostre para ele. Não mande mensagem. Isso é só para você.","Depois de escrever, respire fundo e diga em voz baixa: 'Eu estou pronta para mudar isso.'"],note:"Tempo: 5 minutos. Não precisa de mais."}},
  {day:2,phase:1,title:"O celular na mesa",lead:"Hoje o encontro é sobre criar um espaço de 3 minutos onde o celular não existe.",lesson:"<p>O celular é o maior ladrão de tempo a dois da nossa geração. Não porque ele é ruim — mas porque ele está <strong>sempre lá</strong>, competindo com o olhar do outro.</p><p>Hoje, você vai criar uma âncora: <strong>3 minutos sem tela</strong>. Não precisa ser uma conversa profunda. Pode ser só estar perto, olhar nos olhos, perguntar uma coisa boba.</p><p>A chave é a repetição. Seu cérebro (e o dele) precisa aprender que quando vocês estão juntos, o celular não está. É um novo condicionamento.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um horário — pode ser no jantar, antes de dormir, ou logo de manhã.","Coloque o celular no silencioso e <strong>fora do alcance das mãos</strong>.","Por 3 minutos, sente-se perto dele. Olhe nos olhos. Faça uma pergunta simples: 'Como foi seu dia?'","Se ele estranhar, diga: 'Só quero te ouvir um pouco.'"],note:"Se ele não estiver em casa, faça sozinho: sente-se em silêncio por 3 minutos, sem celular, pensando nele."}},
  {day:3,phase:1,title:"A pergunta que ninguém faz",lead:"Hoje você vai fazer a pergunta que a maioria dos casais deixa de fazer: 'Como você está de verdade?'",lesson:"<p>A maioria das conversas de casal é logística: <em>'pagou a conta?', 'buscou as crianças?', 'o que tem pro jantar?'</em>. Não é errado — mas é insuficiente.</p><p>Hoje, você vai fazer uma pergunta diferente: <strong>'Como você está de verdade?'</strong>. E depois, o mais importante: <strong>escutar sem interromper</strong>.</p><p>Quando alguém se sente ouvido de verdade, ele se abre. E quando ele se abre, vocês voltam a se conectar.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um momento tranquilo.","Pergunte: 'Como você está de verdade? Não o estou bem de sempre. De verdade.'","Escute sem interromper por pelo menos 2 minutos completos.","No fim, agradeça: 'Obrigada por me contar.'"],note:"Se ele não quiser falar hoje, não force. Diga apenas: 'Tudo bem. Estou aqui quando quiser.'"}},
  {day:4,phase:1,title:"O silêncio confortável",lead:"Hoje o encontro é sobre estar junto sem precisar falar nada.",lesson:"<p>Casais que estão bem conseguem ficar em silêncio juntos. Casais que estão distantes precisam preencher o silêncio com celular, TV ou conversa fiada.</p><p>Hoje, o exercício é <strong>estar perto sem fazer nada</strong>. Sente-se ao lado dele. Não pegue o celular. Não ligue a TV.</p><p>O silêncio confortável é uma das maiores provas de intimidade. E ele pode ser treinado.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um momento em que vocês estejam no mesmo ambiente.","Sente-se perto. Não pegue o celular.","Fique em silêncio por 5 minutos.","Ao final, sorria e diga: 'Eu gosto de estar aqui com você.'"],note:"Se o silêncio for muito desconfortável, comece com 2 minutos. Aumente a cada dia."}},
  {day:5,phase:1,title:"O olhar que reconhece",lead:"Hoje você vai olhar para ele como olhava no começo.",lesson:"<p>Quando foi a última vez que você olhou para ele <strong>de verdade</strong>? Não de relance, não de passagem. Um olhar que demora. Um olhar que reconhece.</p><p>Hoje, você vai olhar nos olhos dele por <strong>5 segundos</strong>. Sem falar nada. Só olhar.</p><p>O olhar sustentado libera ocitocina — o hormônio do vínculo.</p>",practice:{title:"O exercício de hoje",steps:["Encontre um momento em que vocês estejam frente a frente.","Olhe nos olhos dele por 5 segundos completos.","Não desvie o olhar. Não ria de nervoso. Só olhe.","Se ele perguntar o que foi, diga: 'Nada. Eu só estava te olhando.'"],note:"O olhar é uma das formas mais primitivas de conexão."}},
  {day:6,phase:1,title:"A memória boa",lead:"Hoje vocês vão revisitar um momento bom — juntos.",lesson:"<p>Casais que estão bem têm uma <strong>biblioteca de memórias boas</strong> que usam para se reconectar.</p><p>Hoje, você vai trazer uma memória boa para a mesa. Não precisa ser grandiosa.</p><p>A chave é: <strong>não usar a memória como arma</strong>. Use como convite: <em>'Lembra quando...?'</em>.</p>",practice:{title:"O exercício de hoje",steps:["Pense em um momento bom que vocês viveram juntos.","Encontre ele em um momento tranquilo e diga: 'Lembra quando a gente...'","Conte a memória com detalhes. Deixe ele completar.","Não transforme em cobrança. Só reviva."],note:"Se vocês tiverem fotos antigas, mostre. A memória visual é ainda mais forte."}},
  {day:7,phase:1,title:"O primeiro check-in",lead:"Hoje é o fechamento da primeira semana. Você vai avaliar o que mudou.",lesson:"<p>Uma semana se passou. Você fez 6 exercícios. Alguns funcionaram, outros não. Está tudo bem.</p><p>Hoje, o exercício é <strong>avaliar sem julgamento</strong>. Não é sobre ter resultado ou não. É sobre <strong>estar em movimento</strong>.</p><p>Amanhã começa a fase 2 — Diálogo.</p>",practice:{title:"O exercício de hoje",steps:["Pegue seu caderno.","Responda: 'Nesta semana, eu notei que...'","Escreva 3 coisas que você sentiu diferentes.","Escreva 1 coisa que ainda está difícil.","Ao final, diga em voz baixa: 'Eu estou no caminho certo.'"],note:"Semana 2 começa amanhã. Descanse hoje."}},
  {day:8,phase:2,title:"A pergunta que abre",lead:"Hoje você vai aprender a fazer perguntas que não fecham o outro.",lesson:"<p>Existem dois tipos de pergunta: as que <strong>abrem</strong> e as que <strong>fecham</strong>. 'Você fez o que eu pedi?' fecha. 'Como você se sentiu hoje?' abre.</p><p>Perguntas abertas convidam o outro a se revelar. E quando alguém se revela, a intimidade cresce.</p>",practice:{title:"O exercício de hoje",steps:["Escolha uma pergunta aberta.","Faça a pergunta em um momento tranquilo.","Escute a resposta completa. Não interrompa.","Ao final, diga: 'Obrigada por me contar.'"],note:"Se ele responder nada, não insista hoje. Tente de novo amanhã."}},
  {day:9,phase:2,title:"Ouvir sem preparar resposta",lead:"Hoje você vai treinar a escuta mais difícil: a escuta sem defesa.",lesson:"<p>Quando o outro fala algo que nos magoa, nossa reação automática é <strong>preparar a defesa</strong>. A gente não escuta — a gente espera a vez de falar.</p><p>Hoje, o exercício é o oposto: <strong>escutar sem preparar resposta</strong>.</p><p>Depois, antes de responder, diga: <em>'Deixa eu ver se eu entendi. Você está dizendo que...'</em>.</p>",practice:{title:"O exercício de hoje",steps:["Quando ele começar a falar algo que te toque, respire fundo.","Não interrompa. Não prepare resposta.","Antes de responder, diga: 'Deixa eu ver se eu entendi. Você está dizendo que...'","Só depois de ele confirmar, responda."],note:"Isso vai parecer estranho no começo. Com a prática, vira hábito."}},
  {day:10,phase:2,title:"O pedido concreto",lead:"Hoje você vai aprender a transformar uma acusação em um pedido claro.",lesson:"<p>Você nunca me escuta é uma acusação. Eu preciso que você desligue a TV quando eu estiver falando é um pedido.</p><p>Acusações fazem o outro se defender. Pedidos concretos fazem o outro agir.</p><p>Use a estrutura: <strong>'Quando [situação], eu me sinto [sentimento]. Eu preciso que [pedido].'</strong></p>",practice:{title:"O exercício de hoje",steps:["Pegue o caderno.","Escreva 3 coisas que te incomodam na rotina.","Transforme cada uma em pedido concreto.","Escolha UM pedido e faça para ele hoje."],note:"Faça só um pedido por dia. Mais que isso vira cobrança."}},
  {day:11,phase:2,title:"A confirmação",lead:"Hoje você vai aprender a arte de confirmar antes de responder.",lesson:"<p>A maioria das brigas de casal nasce de <strong>mal-entendidos</strong>.</p><p>Hoje, você vai treinar a confirmação: antes de responder, pergunte: <em>'O que você quis dizer com isso?'</em>.</p>",practice:{title:"O exercício de hoje",steps:["Na próxima conversa, pergunte: 'O que você quis dizer com isso?'","Escute a resposta. Não interrompa.","Só depois de entender, responda.","Se perceber que entendeu errado, diga: 'Ah, eu tinha entendido outra coisa. Desculpa.'"],note:"Confirmar não é se anular. É se certificar de que está respondendo ao que foi dito."}},
  {day:12,phase:2,title:"A pausa antes da reação",lead:"Hoje você vai aprender a pausa de 10 segundos.",lesson:"<p>Quando algo nos atinge, nosso cérebro reage em <strong>frações de segundo</strong>. A gente responde antes de pensar.</p><p>Hoje, você vai treinar a <strong>pausa de 10 segundos</strong>. Quando sentir a raiva subir, respire e conte até 10 mentalmente.</p>",practice:{title:"O exercício de hoje",steps:["Quando sentir a raiva subir, respire fundo.","Conte mentalmente até 10. Devagar.","Pergunte a si mesma: 'O que eu quero resolver aqui?'","Só então responda."],note:"A pausa é uma habilidade. Quanto mais você treina, mais automática fica."}},
  {day:13,phase:2,title:"O reconhecimento",lead:"Hoje você vai aprender a validar o sentimento do outro.",lesson:"<p>Validar não é concordar. É dizer: <em>'Eu vejo que você está sentindo isso.'</em></p><p>Quando alguém se sente validado, ele <strong>se acalma</strong>.</p>",practice:{title:"O exercício de hoje",steps:["Na próxima vez que ele expressar uma emoção, escute sem interromper.","Não tente resolver.","Diga: 'Eu entendo que você está se sentindo assim. Faz sentido para mim.'","Não defenda seu ponto agora. Só valide."],note:"Validar não significa aceitar tudo. Significa reconhecer o sentimento do outro."}},
  {day:14,phase:2,title:"A conversa completa",lead:"Hoje é o fechamento da segunda semana.",lesson:"<p>Você aprendeu a fazer perguntas abertas, a escutar sem defesa, a confirmar antes de responder, a pausar antes de reagir, a validar o sentimento. Hoje, você vai <strong>juntar tudo</strong>.</p><p>Uma conversa de 15 minutos, sem celular, sem TV, sem interrupção.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um momento tranquilo. 15 minutos livres.","Celular no silencioso, longe.","Comece com uma pergunta aberta.","Escute sem interromper. Valide o que ele sentir.","Só depois de ouvir tudo, fale o que você precisa.","Ao final, agradeça."],note:"Se a conversa não fluir, não force."}},
  {day:15,phase:3,title:"O toque de presença",lead:"Hoje começa a fase do carinho.",lesson:"<p>O toque é a forma mais primitiva de conexão humana.</p><p>Hoje, você vai tocar <strong>sem segundas intenções</strong>. Um toque no braço, na mão, nas costas. Um toque que diz: <em>'eu estou aqui'</em>.</p>",practice:{title:"O exercício de hoje",steps:["Em algum momento do dia, toque nele sem intenção sexual.","Pode ser a mão, o braço, as costas. Um toque leve, de 3 segundos.","Ao tocar, respire e diga em voz baixa: 'Eu estou aqui.'","Se ele perguntar o que foi, sorria e diga: 'Nada. Só queria te tocar.'"],note:"O toque de presença é uma das formas mais rápidas de baixar a guarda do outro."}},
  {day:16,phase:3,title:"O elogio específico",lead:"Hoje você vai elogiar algo específico. Não genérico.",lesson:"<p>Você é lindo é genérico. Eu amo o jeito que você sorri quando fala dos seus sonhos é específico.</p><p>Elogios específicos mostram que você <strong>presta atenção</strong>.</p>",practice:{title:"O exercício de hoje",steps:["Pense em algo específico que você admira nele.","Encontre um momento tranquilo e diga: 'Eu amo o jeito que você...'","Complete com um detalhe concreto.","Não espere elogio de volta. Só elogie."],note:"Elogios específicos são mais poderosos que presentes caros."}},
  {day:17,phase:3,title:"O gesto pequeno",lead:"Hoje você vai fazer um gesto pequeno — sem esperar nada em troca.",lesson:"<p>Casais que estão bem fazem <strong>pequenos gestos diários</strong>: o café feito sem pedir, o bilhete no espelho, a música que ele gosta.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um gesto pequeno que ele gosta.","Faça o gesto sem avisar.","Não cobre reconhecimento.","Se ele notar, sorria e diga: 'Fiz com carinho.'"],note:"Pequenos gestos diários valem mais que grandes gestos ocasionais."}},
  {day:18,phase:3,title:"O abraço de 20 segundos",lead:"Hoje o exercício é um abraço. Mas não um abraço qualquer.",lesson:"<p>Um abraço de 20 segundos libera ocitocina, reduz o cortisol e <strong>acalma o sistema nervoso</strong>. Um abraço de 3 segundos não faz nada disso.</p>",practice:{title:"O exercício de hoje",steps:["Encontre um momento tranquilo.","Abrace ele. Conte mentalmente até 20.","Se ele tentar soltar antes, diga: 'Só mais um pouquinho.'","Ao final, sorria e diga: 'Obrigada.'"],note:"O abraço de 20 segundos é uma das formas mais rápidas de baixar a guarda do outro."}},
  {day:19,phase:3,title:"A presença sem tela",lead:"Hoje você vai dedicar 10 minutos inteiros a ele.",lesson:"<p>Você já fez 3 minutos sem tela no dia 2. Hoje, o exercício é <strong>10 minutos</strong>.</p><p>O importante é <strong>estar presente</strong>.</p>",practice:{title:"O exercício de hoje",steps:["Escolha 10 minutos livres.","Celular no silencioso, longe. TV desligada.","Sente-se perto dele. Converse ou fique em silêncio.","Ao final, diga: 'Obrigada por esses 10 minutos.'"],note:"Se 10 minutos for muito, comece com 5."}},
  {day:20,phase:3,title:"O plano de vocês",lead:"Hoje você vai marcar algo. Um plano concreto para vocês dois.",lesson:"<p>Casais que estão bem têm <strong>planos concretos</strong>. Casais que estão distantes dizem vamos marcar algo — e nunca marcam.</p><p>O importante é <strong>ter uma data</strong>.</p>",practice:{title:"O exercício de hoje",steps:["Pense em algo simples que vocês possam fazer juntos.","Encontre ele e diga: 'Eu queria marcar uma coisa com você.'","Proponha o plano. Escolha uma data. Anote.","Coloque no calendário."],note:"O plano não precisa ser caro. Precisa ser real."}},
  {day:21,phase:3,title:"O novo começo",lead:"Hoje é o último dia. Você chegou. Vamos celebrar.",lesson:"<p>21 dias. 21 encontros. Você chegou até aqui. Isso não é pouco.</p><p>Hoje, o exercício é <strong>celebrar</strong>. Não é sobre o que mudou ou não mudou. É sobre o que você fez.</p><p>O protocolo não acaba aqui. Ele vira rotina.</p>",practice:{title:"O exercício de hoje",steps:["Pegue o caderno.","Responda: 'Nesses 21 dias, o que mudou em mim foi...'","Responda: 'O que mudou entre nós foi...'","Escolha 3 exercícios que mais funcionaram.","Escreva um compromisso: 'Eu vou continuar cultivando o dia a dois.'","Celebre."],note:"Você pode repetir os 21 dias quantas vezes quiser."}}
];

function markDone(day){ progress[day] = !progress[day]; saveProgress(); renderCurrentView(); renderSidebar(); updateTopProgress(); }
function isDone(day){ return !!progress[day]; }
function countDone(){ return Object.keys(progress).filter(function(k){ return progress[k]; }).length; }

function showView(view){ currentView = view; renderCurrentView(); renderSidebar(); closeSidebar(); window.scrollTo({top:0,behavior:'smooth'}); }
function showDay(day){ currentView = 'day'; currentViewDay = day; renderCurrentView(); renderSidebar(); closeSidebar(); window.scrollTo({top:0,behavior:'smooth'}); }

function renderSidebar(){
  var f1 = document.getElementById('sidebarFase1');
  var f2 = document.getElementById('sidebarFase2');
  var f3 = document.getElementById('sidebarFase3');
  if(!f1 || !f2 || !f3) return;
  f1.innerHTML = ''; f2.innerHTML = ''; f3.innerHTML = '';
  DAYS.forEach(function(d){
    var btn = document.createElement('button');
    var cls = 'sidebar-item';
    if(currentView === 'day' && currentViewDay === d.day) cls += ' active';
    if(isDone(d.day)) cls += ' done';
    btn.className = cls;
    btn.innerHTML = '<span class="num"><span class="num-text">' + String(d.day).padStart(2,'0') + '</span></span><span>' + d.title + '</span>';
    btn.onclick = function(){ showDay(d.day); };
    if(d.phase === 1) f1.appendChild(btn);
    else if(d.phase === 2) f2.appendChild(btn);
    else f3.appendChild(btn);
  });
}

function updateTopProgress(){
  var done = countDone();
  var total = DAYS.length;
  var el1 = document.getElementById('topProgressText');
  var el2 = document.getElementById('topProgressFill');
  if(el1) el1.textContent = done + '/' + total;
  if(el2) el2.style.width = (done/total*100) + '%';
}

function renderCurrentView(){
  var main = document.getElementById('mainContent');
  if(!main) return;
  if(currentView === 'dashboard') main.innerHTML = renderDashboard();
  else if(currentView === 'day') main.innerHTML = renderDay(currentViewDay);
}

function renderDashboard(){
  var done = countDone();
  var total = DAYS.length;
  var pct = Math.round(done/total*100);
  var nextDay = null;
  for(var i=0; i<DAYS.length; i++){ if(!isDone(DAYS[i].day)){ nextDay = DAYS[i]; break; } }
  if(!nextDay) nextDay = DAYS[DAYS.length-1];
  var f1 = DAYS.filter(function(d){ return d.phase===1 && isDone(d.day); }).length;
  var f2 = DAYS.filter(function(d){ return d.phase===2 && isDone(d.day); }).length;
  var f3 = DAYS.filter(function(d){ return d.phase===3 && isDone(d.day); }).length;
  var btnText = done===0 ? 'Começar o Dia 1' : done===total ? 'Revisitar os 21 dias' : 'Continuar no Dia ' + nextDay.day;
  return '<div class="content">'
    + '<div class="dash-hero"><div class="dash-badge">Protocolo Essencial</div><h1>Bem-vinda ao seu <em>Protocolo dos 21 Encontros</em></h1><p>Um dia de cada vez. Um encontro de cada vez. Você já começou — e isso é o mais importante.</p></div>'
    + '<div class="dash-progress"><div class="big">' + done + '<small>/' + total + '</small></div><div class="label">encontros concluídos — ' + pct + '% do protocolo</div><div class="dash-bar"><div class="dash-bar-fill" style="width:' + pct + '%"></div></div><a href="#" class="dash-continue" onclick="showDay(' + nextDay.day + ');return false;">' + btnText + '<span>→</span></a></div>'
    + '<div class="phase-grid">'
    + '<div class="phase-card"><div class="phase-num">Fase 1</div><h4>Presença</h4><p>Dias 1 a 7 — voltar a se ver</p><div class="phase-progress">' + f1 + '/7 concluídos</div></div>'
    + '<div class="phase-card"><div class="phase-num">Fase 2</div><h4>Diálogo</h4><p>Dias 8 a 14 — voltar a conversar</p><div class="phase-progress">' + f2 + '/7 concluídos</div></div>'
    + '<div class="phase-card"><div class="phase-num">Fase 3</div><h4>Carinho</h4><p>Dias 15 a 21 — voltar a se tocar</p><div class="phase-progress">' + f3 + '/7 concluídos</div></div>'
    + '</div></div>';
}

function renderDay(dayNum){
  var d = null;
  for(var i=0; i<DAYS.length; i++){ if(DAYS[i].day === dayNum){ d = DAYS[i]; break; } }
  if(!d) return '<div class="content"><p>Dia não encontrado.</p></div>';
  var done = isDone(dayNum);
  var phase = PHASES[d.phase];
  var prevAttr = dayNum === 1 ? 'disabled' : '';
  var nextAttr = dayNum === DAYS.length ? 'disabled' : '';
  return '<div class="content">'
    + '<div class="day-header"><div class="day-eyebrow">Dia ' + String(d.day).padStart(2,'0') + ' · Fase ' + d.phase + ' — ' + phase.name + '</div><h1>' + d.title + '</h1><p class="day-lead">' + d.lead + '</p></div>'
    + '<div class="section-block"><h2><span class="block-icon">📖</span> Aula escrita</h2><div class="content-text">' + d.lesson + '</div></div>'
    + '<div class="section-block"><h2><span class="block-icon">✍️</span> Prática do dia</h2><div class="practice-box"><div class="practice-label">Exercício</div><h3>' + d.practice.title + '</h3><ol>' + d.practice.steps.map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ol><div class="practice-note">' + d.practice.note + '</div></div></div>'
    + '<div class="day-actions"><button class="btn-nav" onclick="showDay(' + (dayNum-1) + ')" ' + prevAttr + '>← Dia anterior</button><button class="btn-done ' + (done?'completed':'') + '" onclick="markDone(' + dayNum + ')">' + (done?'✓ Concluído — desmarcar':'Marcar como concluído') + '</button><button class="btn-nav" onclick="showDay(' + (dayNum+1) + ')" ' + nextAttr + '>Próximo dia →</button></div>'
    + '</div>';
}

function closeSidebar(){ var sb = document.getElementById('sidebar'); if(sb) sb.classList.remove('open'); }
document.getElementById('menuBtn').addEventListener('click', function(){ var sb = document.getElementById('sidebar'); if(sb) sb.classList.toggle('open'); });

try {
  renderCurrentView();
  renderSidebar();
  updateTopProgress();
} catch(err) {
  console.error('Erro na inicialização:', err);
  var main = document.getElementById('mainContent');
  if(main){
    main.innerHTML = '<div class="error-box"><h2>Erro ao carregar</h2><p>Recarregue a página.</p><button onclick="location.reload()">Recarregar</button></div>';
  }
}
</script>

</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protocolo dos 21 Encontros — Área de Membros</title>
<style>
:root{--ink:#2b121d;--paper:#fbf8f2;--cream:#f3ece5;--gold:#e6b85c;--gold-light:#f6d4a2;--coral:#df6548;--coral-dark:#914a35;--display:"Instrument Serif",Georgia,serif;--body:"DM Sans",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
.topbar{position:sticky;top:0;z-index:100;background:linear-gradient(120deg,#2b121d,#3b1c29);color:var(--paper);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid rgba(230,184,92,.2)}
.topbar-brand{font-family:var(--display);font-size:22px;color:var(--gold-light)}
.topbar-brand span{color:var(--coral)}
.topbar-right{display:flex;align-items:center;gap:16px;font-size:13px;color:#c9b6a6}
.topbar-progress{display:flex;align-items:center;gap:8px}
.progress-mini{width:120px;height:6px;background:rgba(230,184,92,.2);border-radius:99px;overflow:hidden}
.progress-mini-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:99px;transition:width .4s}
.topbar-menu-btn{display:none;background:rgba(230,184,92,.15);border:1px solid rgba(230,184,92,.4);border-radius:8px;padding:8px 12px;color:var(--gold-light);font-size:13px;font-weight:600}
.app{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 60px)}
.sidebar{background:var(--ink);color:var(--paper);padding:24px 0;border-right:1px solid rgba(230,184,92,.15);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sidebar-header{padding:0 20px 20px;border-bottom:1px solid rgba(230,184,92,.15);margin-bottom:20px}
.sidebar-header h3{font-family:var(--display);font-size:20px;font-weight:400;color:var(--gold-light);margin-bottom:6px}
.sidebar-header p{font-size:12px;color:#a893a0}
.sidebar-section{padding:0 20px;margin-bottom:24px}
.sidebar-section h4{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;color:#e8d9cb;cursor:pointer;transition:background .15s;margin-bottom:2px;border:0;background:none;width:100%;text-align:left}
.sidebar-item:hover{background:rgba(230,184,92,.1)}
.sidebar-item.active{background:rgba(230,184,92,.18);color:var(--gold-light);font-weight:600}
.sidebar-item.done{opacity:.75}
.sidebar-item .num{font-family:var(--display);font-size:16px;width:26px;flex:none;color:var(--gold)}
.sidebar-item.done .num::after{content:"✓";color:var(--coral);font-size:14px;font-family:var(--body);font-weight:700}
.sidebar-item.done .num-text{display:none}
.sidebar-divider{height:1px;background:rgba(230,184,92,.15);margin:16px 20px}
.main{padding:36px 32px 80px;max-width:900px}
.content{background:#fff;border:1px solid rgba(24,15,27,.08);border-radius:20px;padding:40px;box-shadow:0 12px 32px rgba(74,26,48,.06)}
.dash-hero{text-align:center;margin-bottom:32px}
.dash-hero h1{font-family:var(--display);font-size:clamp(28px,4vw,42px);font-weight:400;line-height:1.15;margin-bottom:10px}
.dash-hero h1 em{color:var(--coral-dark);font-style:italic}
.dash-hero p{color:#6b5560;font-size:16px;max-width:560px;margin:0 auto}
.dash-progress{background:linear-gradient(145deg,#fffaf1,#f3ece5);border:1px solid rgba(230,184,92,.4);border-radius:16px;padding:24px;margin:28px 0;text-align:center}
.dash-progress .big{font-family:var(--display);font-size:48px;line-height:1;color:var(--coral-dark);font-weight:400;margin-bottom:8px}
.dash-progress .big small{font-size:20px;color:#8a7480}
.dash-progress .label{font-size:14px;color:#6b5560;margin-bottom:16px}
.dash-bar{height:12px;background:rgba(24,15,27,.08);border-radius:99px;overflow:hidden;max-width:400px;margin:0 auto}
.dash-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:99px;transition:width .6s}
.dash-continue{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:linear-gradient(165deg,#ffe09b,#ebbc60 40%,#d89a34);color:#291b0c;font-weight:700;font-size:15px;padding:14px 28px;border-radius:12px;border:1px solid #fff0c4;border-bottom:3px solid #9f6621;box-shadow:0 6px 18px rgba(22,6,14,.2);transition:transform .18s}
.dash-continue:hover{transform:translateY(-2px)}
.phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.phase-card{background:#fff;border:1px solid rgba(24,15,27,.08);border-radius:14px;padding:20px;text-align:center}
.phase-card .phase-num{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--coral-dark);margin-bottom:6px}
.phase-card h4{font-family:var(--display);font-size:20px;font-weight:400;margin-bottom:6px}
.phase-card p{font-size:13px;color:#7a5f6a;line-height:1.5}
.phase-card .phase-progress{margin-top:12px;font-size:12px;color:var(--coral-dark);font-weight:600}
.day-header{margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid rgba(24,15,27,.1)}
.day-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-dark);margin-bottom:8px}
.day-header h1{font-family:var(--display);font-size:clamp(28px,4vw,40px);font-weight:400;line-height:1.15;margin-bottom:12px}
.day-header .day-lead{font-size:17px;color:#4a3540;line-height:1.6}
.audio-box{background:linear-gradient(145deg,#2b121d 0%,#3b1c29 50%,#2b121d 100%);border-radius:20px;padding:0;margin-bottom:32px;color:var(--paper);position:relative;overflow:hidden;border:1px solid rgba(230,184,92,.35);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.audio-box::before{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 30%,rgba(230,184,92,.08),transparent 60%);pointer-events:none}
.audio-head{position:relative;padding:22px 24px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(230,184,92,.18)}
.audio-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--coral));display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 6px 18px rgba(223,101,72,.45),inset 0 1px 0 rgba(255,255,255,.3);position:relative}
.audio-icon::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:1px solid rgba(230,184,92,.4);animation:audioPulse 2.4s ease-in-out infinite}
@keyframes audioPulse{0%,100%{opacity:0;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.audio-head-info{flex:1;min-width:0}
.audio-kicker{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.audio-head-title{font-family:var(--display);font-size:19px;font-weight:400;line-height:1.2;color:#fff;letter-spacing:.01em}
.audio-waves{display:flex;align-items:flex-end;gap:3px;height:24px;flex:none;opacity:.85}
.audio-waves span{width:3px;background:linear-gradient(180deg,var(--gold),var(--coral));border-radius:2px;animation:audioWave 1.2s ease-in-out infinite}
.audio-waves span:nth-child(1){height:8px;animation-delay:0s}
.audio-waves span:nth-child(2){height:16px;animation-delay:.15s}
.audio-waves span:nth-child(3){height:22px;animation-delay:.3s}
.audio-waves span:nth-child(4){height:14px;animation-delay:.45s}
.audio-waves span:nth-child(5){height:10px;animation-delay:.6s}
@keyframes audioWave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.audio-player-area{position:relative;padding:20px 24px 22px}
.audio-footer{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.audio-tip{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#c9b6a6;line-height:1.4}
.audio-tip .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:audioWave 1.8s ease-in-out infinite;flex:none}
.audio-duration-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--gold-light);background:rgba(230,184,92,.12);border:1px solid rgba(230,184,92,.3);padding:5px 10px;border-radius:99px;flex:none}
.audio-pending-box{text-align:center;padding:24px 16px;background:rgba(230,184,92,.08);border:1px dashed rgba(230,184,92,.35);border-radius:14px;color:#a893a0;font-size:13px;line-height:1.5}
.custom-audio{display:flex;align-items:center;gap:16px;padding:4px 0}
.custom-audio .play-btn{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--coral));display:grid;place-items:center;color:#fff;font-size:22px;flex:none;cursor:pointer;transition:transform .15s,box-shadow .15s;border:0;box-shadow:0 6px 18px rgba(223,101,72,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.custom-audio .play-btn:hover{transform:scale(1.06);box-shadow:0 8px 24px rgba(223,101,72,.65),inset 0 1px 0 rgba(255,255,255,.3)}
.custom-audio .play-btn:active{transform:scale(.97)}
.custom-audio .play-btn.playing{background:linear-gradient(135deg,var(--coral),var(--coral-dark))}
.custom-audio .audio-body{flex:1;min-width:0}
.custom-audio .audio-progress{height:10px;background:rgba(230,184,92,.22);border-radius:99px;overflow:hidden;margin-bottom:8px;cursor:pointer;position:relative;touch-action:none;border:1px solid rgba(230,184,92,.25)}
.custom-audio .audio-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:99px;width:0%;transition:width .1s linear;pointer-events:none;box-shadow:0 0 8px rgba(230,184,92,.5)}
.custom-audio .audio-meta{display:flex;justify-content:space-between;font-size:12px;color:#a893a0;letter-spacing:.04em;font-variant-numeric:tabular-nums;font-weight:500}
.custom-audio .audio-meta .audio-time{color:var(--gold-light);font-weight:600}
.audio-error-msg{margin-top:12px;padding:10px 14px;background:rgba(223,101,72,.15);border:1px solid rgba(223,101,72,.4);border-radius:8px;font-size:12px;color:#f6d4a2;text-align:center;line-height:1.5}
.audio-error-msg a{color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bonus-audio-item .audio-box{margin-top:10px;margin-bottom:0;border-radius:14px}
.bonus-audio-item .audio-head{padding:16px 18px 12px;gap:10px}
.bonus-audio-item .audio-icon{width:38px;height:38px;font-size:17px;border-radius:11px}
.bonus-audio-item .audio-icon::after{border-radius:13px}
.bonus-audio-item .audio-head-title{font-size:15px}
.bonus-audio-item .audio-kicker{font-size:9px}
.bonus-audio-item .audio-waves{height:18px}
.bonus-audio-item .audio-waves span{width:2px}
.bonus-audio-item .audio-waves span:nth-child(1){height:6px}
.bonus-audio-item .audio-waves span:nth-child(2){height:12px}
.bonus-audio-item .audio-waves span:nth-child(3){height:16px}
.bonus-audio-item .audio-waves span:nth-child(4){height:10px}
.bonus-audio-item .audio-waves span:nth-child(5){height:7px}
.bonus-audio-item .audio-player-area{padding:14px 16px 16px}
.bonus-audio-item .audio-footer{margin-top:10px}
.bonus-audio-item .audio-tip{font-size:11px}
.bonus-audio-item .audio-duration-tag{font-size:10px;padding:4px 8px}
.bonus-audio-item .audio-pending-box{padding:18px 12px;font-size:12px}
.bonus-audio-item .custom-audio .play-btn{width:48px;height:48px;font-size:18px}
.section-block{margin-bottom:32px}
.section-block h2{font-family:var(--display);font-size:26px;font-weight:400;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.section-block h2 .block-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--coral));display:grid;place-items:center;font-size:18px;flex:none}
.section-block .content-text{font-size:16px;line-height:1.75;color:#3b1c29}
.section-block .content-text p{margin-bottom:14px}
.section-block .content-text p:last-child{margin-bottom:0}
.section-block .content-text strong{color:var(--coral-dark)}
.practice-box{background:#fffaf1;border:2px solid var(--gold);border-radius:16px;padding:24px;margin-top:8px}
.practice-box .practice-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-dark);margin-bottom:12px}
.practice-box h3{font-family:var(--display);font-size:22px;font-weight:400;margin-bottom:12px;line-height:1.2}
.practice-box ol,.practice-box ul{padding-left:22px;margin-bottom:14px}
.practice-box li{padding:6px 0;font-size:15px;line-height:1.6}
.practice-box .practice-note{font-size:14px;color:#7a5f6a;font-style:italic;padding-top:12px;border-top:1px dashed rgba(24,15,27,.15)}
.day-actions{display:flex;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid rgba(24,15,27,.1);flex-wrap:wrap}
.btn-done{background:linear-gradient(165deg,#ffe09b,#ebbc60 40%,#d89a34);color:#291b0c;font-weight:700;font-size:15px;padding:14px 28px;border-radius:12px;border:1px solid #fff0c4;border-bottom:3px solid #9f6621;box-shadow:0 6px 18px rgba(22,6,14,.2);transition:transform .18s;flex:1;min-width:200px;cursor:pointer}
.btn-done:hover{transform:translateY(-2px)}
.btn-done.completed{background:linear-gradient(165deg,#a8d5a8,#7fb87f 40%,#5a9a5a);border-color:#c8e8c8;border-bottom-color:#3a7a3a}
.btn-nav{background:#fff;border:1px solid rgba(24,15,27,.15);color:var(--ink);font-weight:600;font-size:14px;padding:14px 20px;border-radius:12px;transition:background .15s;cursor:pointer}
.btn-nav:hover{background:#f3ece5}
.btn-nav:disabled{opacity:.4;cursor:not-allowed}
.bonus-header{text-align:center;margin-bottom:32px}
.bonus-header h1{font-family:var(--display);font-size:clamp(28px,4vw,40px);font-weight:400;line-height:1.15;margin-bottom:10px}
.bonus-header h1 em{color:var(--coral-dark);font-style:italic}
.bonus-card-full{background:#fff;border:1px solid rgba(24,15,27,.08);border-radius:16px;padding:28px;margin-bottom:20px;box-shadow:0 8px 24px rgba(74,26,48,.05)}
.bonus-card-full .bonus-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--coral);padding:4px 10px;border-radius:99px;margin-bottom:12px}
.bonus-card-full h2{font-family:var(--display);font-size:24px;font-weight:400;margin-bottom:10px}
.bonus-card-full .bonus-desc{font-size:15px;color:#5a4149;line-height:1.6;margin-bottom:16px}
.bonus-audio-item{padding:14px 0;border-top:1px solid rgba(24,15,27,.08)}
.bonus-audio-item .bonus-audio-title{font-size:14px;font-weight:600;color:#3b1c29;margin-bottom:4px}
.bonus-audio-item .bonus-audio-desc{font-size:12px;color:#7a5f6a;line-height:1.4;margin-bottom:8px}
.msg-list{display:grid;gap:12px;margin-top:16px}
.msg-item{background:#fffaf1;border:1px solid rgba(230,184,92,.4);border-radius:12px;padding:16px 18px;position:relative}
.msg-item .msg-num{font-size:11px;font-weight:700;color:var(--coral-dark);letter-spacing:.1em;margin-bottom:6px}
.msg-item .msg-text{font-size:15px;line-height:1.55;color:#3b1c29;padding-right:80px}
.msg-item .msg-copy{position:absolute;top:12px;right:12px;font-size:11px;background:var(--gold);color:#291b0c;padding:4px 10px;border-radius:6px;font-weight:600;cursor:pointer;border:0}
.pdf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px}
.pdf-card{background:#fff;border:1px solid rgba(24,15,27,.08);border-radius:14px;padding:24px;text-align:center;transition:transform .15s,box-shadow .15s;cursor:pointer}
.pdf-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(74,26,48,.1)}
.pdf-icon{width:64px;height:80px;margin:0 auto 16px;background:linear-gradient(145deg,#5b2c3e,#2e1320);border:1px solid #b88c56;border-radius:3px 6px 6px 3px;display:grid;place-items:center;color:var(--gold-light);font-size:22px;box-shadow:3px 4px 0 #e0d5c4,4px 6px 8px rgba(61,24,43,.15)}
.pdf-card h4{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.pdf-card p{font-size:13px;color:#7a5f6a;line-height:1.5;margin-bottom:16px}
.pdf-card .pdf-btn{display:inline-block;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:10px 20px;border-radius:8px;transition:background .15s;border:0;cursor:pointer}
.pdf-card .pdf-btn:hover{background:var(--coral-dark)}
.pdf-viewer{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 32px rgba(74,26,48,.1)}
.pdf-toolbar{background:var(--ink);color:var(--paper);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pdf-toolbar-left{display:flex;align-items:center;gap:12px}
.pdf-back-btn{background:rgba(230,184,92,.15);border:1px solid rgba(230,184,92,.4);border-radius:8px;padding:8px 14px;color:var(--gold-light);font-size:13px;font-weight:600;cursor:pointer}
.pdf-toolbar h3{font-family:var(--display);font-size:18px;font-weight:400;color:var(--gold-light)}
.pdf-print-btn{background:linear-gradient(165deg,#ffe09b,#ebbc60 40%,#d89a34);color:#291b0c;font-weight:700;font-size:13px;padding:10px 20px;border-radius:8px;border:1px solid #fff0c4;border-bottom:2px solid #9f6621;cursor:pointer}
.pdf-page-container{background:#e8e2d8;padding:24px 16px}
.pdf-page{background:#fff;max-width:794px;margin:0 auto 20px;padding:60px 56px;box-shadow:0 4px 20px rgba(0,0,0,.12);color:#2b121d;font-size:14px;line-height:1.6;position:relative}
.pdf-cover{background:linear-gradient(145deg,#2b121d,#3b1c29);color:var(--paper);padding:80px 56px;min-height:800px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.pdf-cover-brand{font-family:var(--display);font-size:32px;color:var(--gold-light);margin-bottom:60px}
.pdf-cover-brand span{color:var(--coral)}
.pdf-cover-divider{width:80px;height:3px;background:linear-gradient(90deg,var(--gold),var(--coral));margin:0 auto 40px}
.pdf-cover h1{font-family:var(--display);font-size:52px;font-weight:400;line-height:1.1;margin-bottom:20px;color:#fff}
.pdf-cover h1 em{color:var(--gold);font-style:italic}
.pdf-cover-subtitle{font-size:16px;color:#c9b6a6;line-height:1.6;max-width:400px;margin:0 auto 40px}
.pdf-cover-meta{font-size:12px;color:#8a7480;letter-spacing:.15em;text-transform:uppercase}
.pdf-page h2{font-family:var(--display);font-size:32px;font-weight:400;line-height:1.15;margin-bottom:8px}
.pdf-page h2 em{color:var(--coral-dark);font-style:italic}
.pdf-page h3{font-family:var(--display);font-size:22px;font-weight:400;margin:20px 0 10px}
.pdf-page .page-eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--coral-dark);margin-bottom:10px}
.pdf-page p{margin-bottom:12px;color:#3b1c29;font-size:14px;line-height:1.7}
.pdf-page .page-divider{width:60px;height:2px;background:#e6b85c;margin:20px 0}
.caderno-day-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:20px;border-bottom:2px solid #2b121d;margin-bottom:24px}
.caderno-day-number{font-family:var(--display);font-size:72px;line-height:.9;color:#e6b85c;font-weight:400}
.caderno-day-info{flex:1;margin-left:24px}
.caderno-day-phase{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#914a35;margin-bottom:6px}
.caderno-day-title{font-family:var(--display);font-size:26px;font-weight:400;line-height:1.15}
.writing-section{margin-bottom:20px}
.writing-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#914a35;margin-bottom:10px}
.writing-lines{border-bottom:1px dashed #b8a5ab;min-height:28px}
.guia-item{background:#fffaf1;border:1px solid #e6b85c66;border-radius:10px;padding:16px 18px;margin-bottom:12px}
.guia-item-num{font-size:10px;font-weight:700;color:#914a35;letter-spacing:.1em;margin-bottom:6px}
.guia-item-text{font-size:15px;line-height:1.55;color:#2b121d;font-weight:500}
.mapa-phase{margin-bottom:24px;text-align:left}
.mapa-phase-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #b8a5ab}
.mapa-phase-num{font-family:var(--display);font-size:24px;color:#df6548;font-weight:400;line-height:1}
.mapa-phase-title h3{font-family:var(--display);font-size:20px;font-weight:400;margin:0}
.mapa-checkboxes{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.mapa-checkbox{border:1.5px solid #b8a5ab;border-radius:6px;padding:8px 4px;text-align:center;min-height:60px;display:flex;flex-direction:column;justify-content:space-between}
.mapa-checkbox .cb-num{font-size:12px;font-weight:700;line-height:1}
.mapa-checkbox .cb-square{width:20px;height:20px;border:1.5px solid #b8a5ab;border-radius:4px;margin:6px auto 0}
.error-box{padding:40px;background:#fff;border-radius:16px;max-width:600px;margin:40px auto;text-align:center;font-family:sans-serif}
.error-box h2{color:#2b121d;margin-bottom:16px;font-size:24px}
.error-box p{color:#666;margin-bottom:12px;font-size:14px;line-height:1.6}
.error-box button{margin-top:20px;padding:12px 24px;background:#e6b85c;border:0;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
@media(max-width:900px){

  .topbar-menu-btn{display:block}
  .main{padding:24px 16px 80px}
  .content{padding:24px 18px;border-radius:16px}
  .phase-grid{grid-template-columns:1fr}
  .pdf-grid{grid-template-columns:1fr}
  .day-actions{flex-direction:column}
  .btn-done{width:100%}
  .day-header h1{font-size:26px}
  .section-block h2{font-size:22px}
  .pdf-page{padding:32px 24px}
  .pdf-cover{padding:40px 24px}
  .pdf-cover h1{font-size:36px}
  .mapa-checkboxes{grid-template-columns:repeat(4,1fr)}
  .msg-item .msg-text{padding-right:0}
  .msg-item .msg-copy{position:static;margin-top:10px;display:inline-block}
  .audio-head{padding:18px 18px 14px;gap:12px}
  .audio-icon{width:42px;height:42px;font-size:19px;border-radius:12px}

}

  .audio-kicker{font-size:9px}

  .custom-audio .audio-meta{font-size:11px}
}

<script>
var progress = {};
try {
  var stored = localStorage.getItem('protocolo21_progress');
  if (stored) progress = JSON.parse(stored) || {};
} catch (e) { progress = {}; }

var currentView = 'dashboard';

function saveProgress(){ try { localStorage.setItem('protocolo21_progress', JSON.stringify(progress)); } catch(e){} }

var PHASES = { 1: {name: "Presença"}, 2: {name: "Diálogo"}, 3: {name: "Carinho"} };

var DAYS = [
  {day:1,phase:1,title:"O primeiro encontro",lead:"Hoje começa o seu protocolo. E o primeiro passo não é fazer nada — é perceber o que você perdeu.",audioUrl:"audio/AUDIO_1_URL.mp3",lesson:"<p>Antes de mudar qualquer coisa, você precisa <strong>ver com clareza o que está acontecendo</strong>. Não com culpa, não com raiva. Com honestidade.</p><p>Quando foi a última vez que vocês fizeram algo juntos que não envolvesse celular, TV ou filhos? Quando foi a última vez que vocês riram de verdade, um do outro?</p><p>Não é sobre acusar. É sobre reconhecer. O tempo que era de vocês foi sendo ocupado por tudo o mais — e isso não aconteceu de uma vez. Aconteceu em pequenas ausências.</p><p><strong>O primeiro encontro é o encontro com a verdade.</strong> Hoje, você não vai fazer nada com ele. Vai apenas perceber.</p>",practice:{title:"O exercício de hoje",steps:["Pegue um caderno ou o bloco de notas do celular.","Escreva: 'O que eu sinto falta na nossa rotina é...' — e complete com 3 coisas concretas.","Não mostre para ele. Não mande mensagem. Isso é só para você.","Depois de escrever, respire fundo e diga em voz baixa: 'Eu estou pronta para mudar isso.'"],note:"Tempo: 5 minutos. Não precisa de mais."}},
  {day:2,phase:1,title:"O celular na mesa",lead:"Hoje o encontro é sobre criar um espaço de 3 minutos onde o celular não existe.",audioUrl:"audio/AUDIO_2_URL.mp3",lesson:"<p>O celular é o maior ladrão de tempo a dois da nossa geração. Não porque ele é ruim — mas porque ele está <strong>sempre lá</strong>, competindo com o olhar do outro.</p><p>Hoje, você vai criar uma âncora: <strong>3 minutos sem tela</strong>. Não precisa ser uma conversa profunda. Pode ser só estar perto, olhar nos olhos, perguntar uma coisa boba.</p><p>A chave é a repetição. Seu cérebro (e o dele) precisa aprender que quando vocês estão juntos, o celular não está. É um novo condicionamento.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um horário — pode ser no jantar, antes de dormir, ou logo de manhã.","Coloque o celular no silencioso e <strong>fora do alcance das mãos</strong>.","Por 3 minutos, sente-se perto dele. Olhe nos olhos. Faça uma pergunta simples: 'Como foi seu dia?'","Se ele estranhar, diga: 'Só quero te ouvir um pouco.'"],note:"Se ele não estiver em casa, faça sozinho: sente-se em silêncio por 3 minutos, sem celular, pensando nele."}},
  {day:3,phase:1,title:"A pergunta que ninguém faz",lead:"Hoje você vai fazer a pergunta que a maioria dos casais deixa de fazer: 'Como você está de verdade?'",audioUrl:"audio/AUDIO_3_URL.mp3",lesson:"<p>A maioria das conversas de casal é logística: <em>'pagou a conta?', 'buscou as crianças?', 'o que tem pro jantar?'</em>. Não é errado — mas é insuficiente.</p><p>Hoje, você vai fazer uma pergunta diferente: <strong>'Como você está de verdade?'</strong>. E depois, o mais importante: <strong>escutar sem interromper</strong>.</p><p>Quando alguém se sente ouvido de verdade, ele se abre. E quando ele se abre, vocês voltam a se conectar.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um momento tranquilo.","Pergunte: 'Como você está de verdade? Não o estou bem de sempre. De verdade.'","Escute sem interromper por pelo menos 2 minutos completos.","No fim, agradeça: 'Obrigada por me contar.'"],note:"Se ele não quiser falar hoje, não force. Diga apenas: 'Tudo bem. Estou aqui quando quiser.'"}},
  {day:4,phase:1,title:"O silêncio confortável",lead:"Hoje o encontro é sobre estar junto sem precisar falar nada.",audioUrl:"audio/AUDIO_4_URL.mp3",lesson:"<p>Casais que estão bem conseguem ficar em silêncio juntos. Casais que estão distantes precisam preencher o silêncio com celular, TV ou conversa fiada.</p><p>Hoje, o exercício é <strong>estar perto sem fazer nada</strong>. Sente-se ao lado dele. Não pegue o celular. Não ligue a TV.</p><p>O silêncio confortável é uma das maiores provas de intimidade. E ele pode ser treinado.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um momento em que vocês estejam no mesmo ambiente.","Sente-se perto. Não pegue o celular.","Fique em silêncio por 5 minutos.","Ao final, sorria e diga: 'Eu gosto de estar aqui com você.'"],note:"Se o silêncio for muito desconfortável, comece com 2 minutos. Aumente a cada dia."}},
  {day:5,phase:1,title:"O olhar que reconhece",lead:"Hoje você vai olhar para ele como olhava no começo.",audioUrl:"audio/AUDIO_5_URL.mp3",lesson:"<p>Quando foi a última vez que você olhou para ele <strong>de verdade</strong>? Não de relance, não de passagem. Um olhar que demora. Um olhar que reconhece.</p><p>Hoje, você vai olhar nos olhos dele por <strong>5 segundos</strong>. Sem falar nada. Só olhar.</p><p>O olhar sustentado libera ocitocina — o hormônio do vínculo.</p>",practice:{title:"O exercício de hoje",steps:["Encontre um momento em que vocês estejam frente a frente.","Olhe nos olhos dele por 5 segundos completos.","Não desvie o olhar. Não ria de nervoso. Só olhe.","Se ele perguntar o que foi, diga: 'Nada. Eu só estava te olhando.'"],note:"O olhar é uma das formas mais primitivas de conexão."}},
  {day:6,phase:1,title:"A memória boa",lead:"Hoje vocês vão revisitar um momento bom — juntos.",audioUrl:"audio/AUDIO_6_URL.mp3",lesson:"<p>Casais que estão bem têm uma <strong>biblioteca de memórias boas</strong> que usam para se reconectar.</p><p>Hoje, você vai trazer uma memória boa para a mesa. Não precisa ser grandiosa.</p><p>A chave é: <strong>não usar a memória como arma</strong>. Use como convite: <em>'Lembra quando...?'</em>.</p>",practice:{title:"O exercício de hoje",steps:["Pense em um momento bom que vocês viveram juntos.","Encontre ele em um momento tranquilo e diga: 'Lembra quando a gente...'","Conte a memória com detalhes. Deixe ele completar.","Não transforme em cobrança. Só reviva."],note:"Se vocês tiverem fotos antigas, mostre. A memória visual é ainda mais forte."}},
  {day:7,phase:1,title:"O primeiro check-in",lead:"Hoje é o fechamento da primeira semana. Você vai avaliar o que mudou.",audioUrl:"audio/AUDIO_7_UR.mp3",lesson:"<p>Uma semana se passou. Você fez 6 exercícios. Alguns funcionaram, outros não. Está tudo bem.</p><p>Hoje, o exercício é <strong>avaliar sem julgamento</strong>. Não é sobre ter resultado ou não. É sobre <strong>estar em movimento</strong>.</p><p>Amanhã começa a fase 2 — Diálogo.</p>",practice:{title:"O exercício de hoje",steps:["Pegue seu caderno.","Responda: 'Nesta semana, eu notei que...'","Escreva 3 coisas que você sentiu diferentes.","Escreva 1 coisa que ainda está difícil.","Ao final, diga em voz baixa: 'Eu estou no caminho certo.'"],note:"Semana 2 começa amanhã. Descanse hoje."}},
  {day:8,phase:2,title:"A pergunta que abre",lead:"Hoje você vai aprender a fazer perguntas que não fecham o outro.",audioUrl:"audio/AUDIO_8_URL.mp3",lesson:"<p>Existem dois tipos de pergunta: as que <strong>abrem</strong> e as que <strong>fecham</strong>. 'Você fez o que eu pedi?' fecha. 'Como você se sentiu hoje?' abre.</p><p>Perguntas abertas convidam o outro a se revelar. E quando alguém se revela, a intimidade cresce.</p>",practice:{title:"O exercício de hoje",steps:["Escolha uma pergunta aberta.","Faça a pergunta em um momento tranquilo.","Escute a resposta completa. Não interrompa.","Ao final, diga: 'Obrigada por me contar.'"],note:"Se ele responder nada, não insista hoje. Tente de novo amanhã."}},
  {day:9,phase:2,title:"Ouvir sem preparar resposta",lead:"Hoje você vai treinar a escuta mais difícil: a escuta sem defesa.",audioUrl:"audio/AUDIO_9_URL.mp3",lesson:"<p>Quando o outro fala algo que nos magoa, nossa reação automática é <strong>preparar a defesa</strong>. A gente não escuta — a gente espera a vez de falar.</p><p>Hoje, o exercício é o oposto: <strong>escutar sem preparar resposta</strong>.</p><p>Depois, antes de responder, diga: <em>'Deixa eu ver se eu entendi. Você está dizendo que...'</em>.</p>",practice:{title:"O exercício de hoje",steps:["Quando ele começar a falar algo que te toque, respire fundo.","Não interrompa. Não prepare resposta.","Antes de responder, diga: 'Deixa eu ver se eu entendi. Você está dizendo que...'","Só depois de ele confirmar, responda."],note:"Isso vai parecer estranho no começo. Com a prática, vira hábito."}},
  {day:10,phase:2,title:"O pedido concreto",lead:"Hoje você vai aprender a transformar uma acusação em um pedido claro.",audioUrl:"audio/AUDIO_10_URL.mp3",lesson:"<p>Você nunca me escuta é uma acusação. Eu preciso que você desligue a TV quando eu estiver falando é um pedido.</p><p>Acusações fazem o outro se defender. Pedidos concretos fazem o outro agir.</p><p>Use a estrutura: <strong>'Quando [situação], eu me sinto [sentimento]. Eu preciso que [pedido].'</strong></p>",practice:{title:"O exercício de hoje",steps:["Pegue o caderno.","Escreva 3 coisas que te incomodam na rotina.","Transforme cada uma em pedido concreto.","Escolha UM pedido e faça para ele hoje."],note:"Faça só um pedido por dia. Mais que isso vira cobrança."}},
  {day:11,phase:2,title:"A confirmação",lead:"Hoje você vai aprender a arte de confirmar antes de responder.",audioUrl:"audio/AUDIO_11_URL.mp3",lesson:"<p>A maioria das brigas de casal nasce de <strong>mal-entendidos</strong>.</p><p>Hoje, você vai treinar a confirmação: antes de responder, pergunte: <em>'O que você quis dizer com isso?'</em>.</p>",practice:{title:"O exercício de hoje",steps:["Na próxima conversa, pergunte: 'O que você quis dizer com isso?'","Escute a resposta. Não interrompa.","Só depois de entender, responda.","Se perceber que entendeu errado, diga: 'Ah, eu tinha entendido outra coisa. Desculpa.'"],note:"Confirmar não é se anular. É se certificar de que está respondendo ao que foi dito."}},
  {day:12,phase:2,title:"A pausa antes da reação",lead:"Hoje você vai aprender a pausa de 10 segundos.",audioUrl:"audio/AUDIO_12_URL.mp3",lesson:"<p>Quando algo nos atinge, nosso cérebro reage em <strong>frações de segundo</strong>. A gente responde antes de pensar.</p><p>Hoje, você vai treinar a <strong>pausa de 10 segundos</strong>. Quando sentir a raiva subir, respire e conte até 10 mentalmente.</p>",practice:{title:"O exercício de hoje",steps:["Quando sentir a raiva subir, respire fundo.","Conte mentalmente até 10. Devagar.","Pergunte a si mesma: 'O que eu quero resolver aqui?'","Só então responda."],note:"A pausa é uma habilidade. Quanto mais você treina, mais automática fica."}},
  {day:13,phase:2,title:"O reconhecimento",lead:"Hoje você vai aprender a validar o sentimento do outro.",audioUrl:"audio/AUDIO_13_URL.mp3",lesson:"<p>Validar não é concordar. É dizer: <em>'Eu vejo que você está sentindo isso.'</em></p><p>Quando alguém se sente validado, ele <strong>se acalma</strong>.</p>",practice:{title:"O exercício de hoje",steps:["Na próxima vez que ele expressar uma emoção, escute sem interromper.","Não tente resolver.","Diga: 'Eu entendo que você está se sentindo assim. Faz sentido para mim.'","Não defenda seu ponto agora. Só valide."],note:"Validar não significa aceitar tudo. Significa reconhecer o sentimento do outro."}},
  {day:14,phase:2,title:"A conversa completa",lead:"Hoje é o fechamento da segunda semana.",audioUrl:"audio/AUDIO_14_URL.mp3",lesson:"<p>Você aprendeu a fazer perguntas abertas, a escutar sem defesa, a confirmar antes de responder, a pausar antes de reagir, a validar o sentimento. Hoje, você vai <strong>juntar tudo</strong>.</p><p>Uma conversa de 15 minutos, sem celular, sem TV, sem interrupção.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um momento tranquilo. 15 minutos livres.","Celular no silencioso, longe.","Comece com uma pergunta aberta.","Escute sem interromper. Valide o que ele sentir.","Só depois de ouvir tudo, fale o que você precisa.","Ao final, agradeça."],note:"Se a conversa não fluir, não force."}},
  {day:15,phase:3,title:"O toque de presença",lead:"Hoje começa a fase do carinho.",audioUrl:"audio/AUDIO_15_URL.mp3",lesson:"<p>O toque é a forma mais primitiva de conexão humana.</p><p>Hoje, você vai tocar <strong>sem segundas intenções</strong>. Um toque no braço, na mão, nas costas. Um toque que diz: <em>'eu estou aqui'</em>.</p>",practice:{title:"O exercício de hoje",steps:["Em algum momento do dia, toque nele sem intenção sexual.","Pode ser a mão, o braço, as costas. Um toque leve, de 3 segundos.","Ao tocar, respire e diga em voz baixa: 'Eu estou aqui.'","Se ele perguntar o que foi, sorria e diga: 'Nada. Só queria te tocar.'"],note:"O toque de presença é uma das formas mais rápidas de baixar a guarda do outro."}},
  {day:16,phase:3,title:"O elogio específico",lead:"Hoje você vai elogiar algo específico. Não genérico.",audioUrl:"audio/AUDIO_16_URL.mp3",lesson:"<p>Você é lindo é genérico. Eu amo o jeito que você sorri quando fala dos seus sonhos é específico.</p><p>Elogios específicos mostram que você <strong>presta atenção</strong>.</p>",practice:{title:"O exercício de hoje",steps:["Pense em algo específico que você admira nele.","Encontre um momento tranquilo e diga: 'Eu amo o jeito que você...'","Complete com um detalhe concreto.","Não espere elogio de volta. Só elogie."],note:"Elogios específicos são mais poderosos que presentes caros."}},
  {day:17,phase:3,title:"O gesto pequeno",lead:"Hoje você vai fazer um gesto pequeno — sem esperar nada em troca.",audioUrl:"audio/AUDIO_17_URL.mp3",lesson:"<p>Casais que estão bem fazem <strong>pequenos gestos diários</strong>: o café feito sem pedir, o bilhete no espelho, a música que ele gosta.</p>",practice:{title:"O exercício de hoje",steps:["Escolha um gesto pequeno que ele gosta.","Faça o gesto sem avisar.","Não cobre reconhecimento.","Se ele notar, sorria e diga: 'Fiz com carinho.'"],note:"Pequenos gestos diários valem mais que grandes gestos ocasionais."}},
  {day:18,phase:3,title:"O abraço de 20 segundos",lead:"Hoje o exercício é um abraço. Mas não um abraço qualquer.",audioUrl:"audio/AUDIO_18_URL.mp3",lesson:"<p>Um abraço de 20 segundos libera ocitocina, reduz o cortisol e <strong>acalma o sistema nervoso</strong>. Um abraço de 3 segundos não faz nada disso.</p>",practice:{title:"O exercício de hoje",steps:["Encontre um momento tranquilo.","Abrace ele. Conte mentalmente até 20.","Se ele tentar soltar antes, diga: 'Só mais um pouquinho.'","Ao final, sorria e diga: 'Obrigada.'"],note:"O abraço de 20 segundos é uma das formas mais rápidas de baixar a guarda do outro."}},
  {day:19,phase:3,title:"A presença sem tela",lead:"Hoje você vai dedicar 10 minutos inteiros a ele.",audioUrl:"audio/AUDIO_19_URL.mp3",lesson:"<p>Você já fez 3 minutos sem tela no dia 2. Hoje, o exercício é <strong>10 minutos</strong>.</p><p>O importante é <strong>estar presente</strong>.</p>",practice:{title:"O exercício de hoje",steps:["Escolha 10 minutos livres.","Celular no silencioso, longe. TV desligada.","Sente-se perto dele. Converse ou fique em silêncio.","Ao final, diga: 'Obrigada por esses 10 minutos.'"],note:"Se 10 minutos for muito, comece com 5."}},
  {day:20,phase:3,title:"O plano de vocês",lead:"Hoje você vai marcar algo. Um plano concreto para vocês dois.",audioUrl:"audio/AUDIO_20_URL.mp3",lesson:"<p>Casais que estão bem têm <strong>planos concretos</strong>. Casais que estão distantes dizem vamos marcar algo — e nunca marcam.</p><p>O importante é <strong>ter uma data</strong>.</p>",practice:{title:"O exercício de hoje",steps:["Pense em algo simples que vocês possam fazer juntos.","Encontre ele e diga: 'Eu queria marcar uma coisa com você.'","Proponha o plano. Escolha uma data. Anote.","Coloque no calendário."],note:"O plano não precisa ser caro. Precisa ser real."}},
  {day:21,phase:3,title:"O novo começo",lead:"Hoje é o último dia. Você chegou. Vamos celebrar.",audioUrl:"audio/AUDIO_21_URL.mp3",lesson:"<p>21 dias. 21 encontros. 63 conteúdos. Você chegou até aqui. Isso não é pouco.</p><p>Hoje, o exercício é <strong>celebrar</strong>. Não é sobre o que mudou ou não mudou. É sobre o que você fez.</p><p>O protocolo não acaba aqui. Ele vira rotina.</p>",practice:{title:"O exercício de hoje",steps:["Pegue o caderno.","Responda: 'Nesses 21 dias, o que mudou em mim foi...'","Responda: 'O que mudou entre nós foi...'","Escolha 3 exercícios que mais funcionaram.","Escreva um compromisso: 'Eu vou continuar cultivando o dia a dois.'","Celebre."],note:"Você pode repetir os 21 dias quantas vezes quiser."}}
];

function markDone(day){ progress[day] = !progress[day]; saveProgress(); renderCurrentView(); renderSidebar(); updateTopProgress(); }
function isDone(day){ return !!progress[day]; }
function countDone(){ return Object.keys(progress).filter(function(k){ return progress[k]; }).length; }

function showView(view){ currentView = view; currentPdf = null; renderCurrentView(); renderSidebar(); closeSidebar(); window.scrollTo({top:0,behavior:'smooth'}); }
function showDay(day){ currentView = 'day'; currentViewDay = day; currentPdf = null; renderCurrentView(); renderSidebar(); closeSidebar(); window.scrollTo({top:0,behavior:'smooth'}); }
function showPdf(id){ currentView = 'pdf-view'; currentPdf = id; renderCurrentView(); closeSidebar(); window.scrollTo({top:0,behavior:'smooth'}); }

function isDirectAudio(url){
  if(!url) return false;
  return /\.(mp3|m4a|ogg|wav)(\?|$)/i.test(url) || url.indexOf('http') !== 0;
}

function renderAudioBlock(audioUrl, title){
  var headHtml = '<div class="audio-head">'
    + '<div class="audio-icon">🎧</div>'
    + '<div class="audio-head-info">'
    + '<div class="audio-kicker">Áudio do dia</div>'
    + '<div class="audio-head-title">' + title + '</div>'
    + '</div>'
    + '<div class="audio-waves"><span></span><span></span><span></span><span></span><span></span></div>'
    + '</div>';

  if(!audioUrl || audioUrl.length === 0){
    return headHtml
      + '<div class="audio-player-area">'
      + '<div class="audio-pending-box">'
      + '<div style="font-size:28px;margin-bottom:8px;opacity:.7">🎙️</div>'
      + '<div style="color:#e8d9cb;font-weight:600;font-size:13px;margin-bottom:4px">Em breve</div>'
      + 'Este áudio estará disponível em breve.<br><span style="font-size:11px;opacity:.7">Continue com a aula escrita e a prática do dia.</span>'
      + '</div>'
      + '</div>';
  }

  if(isDirectAudio(audioUrl)){
    return headHtml
      + '<div class="audio-player-area">'
      + '<div class="custom-audio" data-stream="' + audioUrl + '">'
      + '<button class="play-btn" onclick="toggleAudio(this)" type="button">▶</button>'
      + '<div class="audio-body">'
      + '<div class="audio-progress" onclick="seekAudio(event, this)"><div class="audio-progress-fill"></div></div>'
      + '<div class="audio-meta"><span class="audio-time">0:00</span><span class="audio-duration">0:00</span></div>'
      + '</div>'
      + '</div>'
      + '<div class="audio-footer">'
      + '<div class="audio-tip"><span class="dot"></span>Toque no play acima para ouvir</div>'
      + '<div class="audio-duration-tag">⏱️ Áudio curto</div>'
      + '</div>'
      + '</div>';
  }

  // Fallback: iframe (Drive)
  var driveId = audioUrl.match(/(?:\/d\/|id=)([-\w]{20,})/);
  var iframeSrc = driveId ? 'https://drive.google.com/file/d/' + driveId[1] + '/preview' : audioUrl;
  return headHtml
    + '<div class="audio-player-area">'
    + '<iframe src="' + iframeSrc + '" allow="autoplay; encrypted-media" loading="lazy" style="width:100%;height:80px;border:0;border-radius:10px;background:#fff"></iframe>'
    + '<div class="audio-footer">'
    + '<div class="audio-tip"><span class="dot"></span>Toque no play acima para ouvir</div>'
    + '<div class="audio-duration-tag">⏱️ 5–7 min</div>'
    + '</div>'
    + '</div>';
}

function renderSidebar(){
  var f1 = document.getElementById('sidebarFase1');
  var f2 = document.getElementById('sidebarFase2');
  var f3 = document.getElementById('sidebarFase3');
  if(!f1 || !f2 || !f3) return;
  f1.innerHTML = ''; f2.innerHTML = ''; f3.innerHTML = '';
  DAYS.forEach(function(d){
    var btn = document.createElement('button');
    var cls = 'sidebar-item';
    if(currentView === 'day' && currentViewDay === d.day) cls += ' active';
    if(isDone(d.day)) cls += ' done';
    btn.className = cls;
    btn.innerHTML = '<span class="num"><span class="num-text">' + String(d.day).padStart(2,'0') + '</span></span><span>' + d.title + '</span>';
    btn.onclick = function(){ showDay(d.day); };
    if(d.phase === 1) f1.appendChild(btn);
    else if(d.phase === 2) f2.appendChild(btn);
    else f3.appendChild(btn);
  });
}

function updateTopProgress(){
  var done = countDone();
  var total = DAYS.length;
  var el1 = document.getElementById('topProgressText');
  var el2 = document.getElementById('topProgressFill');
  if(el1) el1.textContent = done + '/' + total;
  if(el2) el2.style.width = (done/total*100) + '%';
}

function renderCurrentView(){
  var main = document.getElementById('mainContent');
  if(!main) return;
  if(currentView === 'dashboard') main.innerHTML = renderDashboard();
  else if(currentView === 'day') main.innerHTML = renderDay(currentViewDay);
  else if(currentView === 'bonus') main.innerHTML = renderBonus();
  else if(currentView === 'pdfs') main.innerHTML = renderPdfs();
  else if(currentView === 'pdf-view') main.innerHTML = renderPdfView(currentPdf);
}

function renderDashboard(){
  var done = countDone();
  var total = DAYS.length;
  var pct = Math.round(done/total*100);
  var nextDay = null;
  for(var i=0; i<DAYS.length; i++){ if(!isDone(DAYS[i].day)){ nextDay = DAYS[i]; break; } }
  if(!nextDay) nextDay = DAYS[DAYS.length-1];
  var f1 = DAYS.filter(function(d){ return d.phase===1 && isDone(d.day); }).length;
  var f2 = DAYS.filter(function(d){ return d.phase===2 && isDone(d.day); }).length;
  var f3 = DAYS.filter(function(d){ return d.phase===3 && isDone(d.day); }).length;
  var btnText = done===0 ? 'Começar o Dia 1' : done===total ? 'Revisitar os 21 dias' : 'Continuar no Dia ' + nextDay.day;
  return '<div class="content">'
    + '<div class="dash-hero"><h1>Bem-vinda ao seu <em>Protocolo dos 21 Encontros</em></h1><p>Um dia de cada vez. Um encontro de cada vez. Você já começou — e isso é o mais importante.</p></div>'
    + '<div class="dash-progress"><div class="big">' + done + '<small>/' + total + '</small></div><div class="label">encontros concluídos — ' + pct + '% do protocolo</div><div class="dash-bar"><div class="dash-bar-fill" style="width:' + pct + '%"></div></div><a href="#" class="dash-continue" onclick="showDay(' + nextDay.day + ');return false;">' + btnText + '<span>→</span></a></div>'
    + '<div class="phase-grid">'
    + '<div class="phase-card"><div class="phase-num">Fase 1</div><h4>Presença</h4><p>Dias 1 a 7 — voltar a se ver</p><div class="phase-progress">' + f1 + '/7 concluídos</div></div>'
    + '<div class="phase-card"><div class="phase-num">Fase 2</div><h4>Diálogo</h4><p>Dias 8 a 14 — voltar a conversar</p><div class="phase-progress">' + f2 + '/7 concluídos</div></div>'
    + '<div class="phase-card"><div class="phase-num">Fase 3</div><h4>Carinho</h4><p>Dias 15 a 21 — voltar a se tocar</p><div class="phase-progress">' + f3 + '/7 concluídos</div></div>'
    + '</div></div>';
}

function renderDay(dayNum){
  var d = null;
  for(var i=0; i<DAYS.length; i++){ if(DAYS[i].day === dayNum){ d = DAYS[i]; break; } }
  if(!d) return '<div class="content"><p>Dia não encontrado.</p></div>';
  var done = isDone(dayNum);
  var phase = PHASES[d.phase];
  var prevAttr = dayNum === 1 ? 'disabled' : '';
  var nextAttr = dayNum === DAYS.length ? 'disabled' : '';
  return '<div class="content">'
    + '<div class="day-header"><div class="day-eyebrow">Dia ' + String(d.day).padStart(2,'0') + ' · Fase ' + d.phase + ' — ' + phase.name + '</div><h1>' + d.title + '</h1><p class="day-lead">' + d.lead + '</p></div>'
    + '<div class="audio-box">' + renderAudioBlock(d.audioUrl, 'Dia ' + d.day + ' — ' + d.title) + '</div>'
    + '<div class="section-block"><h2><span class="block-icon">📖</span> Aula escrita</h2><div class="content-text">' + d.lesson + '</div></div>'
    + '<div class="section-block"><h2><span class="block-icon">✍️</span> Prática do dia</h2><div class="practice-box"><div class="practice-label">Exercício</div><h3>' + d.practice.title + '</h3><ol>' + d.practice.steps.map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ol><div class="practice-note">' + d.practice.note + '</div></div></div>'
    + '<div class="day-actions"><button class="btn-nav" onclick="showDay(' + (dayNum-1) + ')" ' + prevAttr + '>← Dia anterior</button><button class="btn-done ' + (done?'completed':'') + '" onclick="markDone(' + dayNum + ')">' + (done?'✓ Concluído — desmarcar':'Marcar como concluído') + '</button><button class="btn-nav" onclick="showDay(' + (dayNum+1) + ')" ' + nextAttr + '>Próximo dia →</button></div>'
    + '</div>';
}

/* ============ GOLDEN AUDIO PLAYER ============ */
var activeAudio = null;
var activeBtn = null;

function toggleAudio(btn){
  var container = btn.closest('.custom-audio');
  if(!container) return;
  var url = container.getAttribute('data-stream');
  if(!url) return;

  if(activeAudio && activeBtn === btn){
    if(activeAudio.paused){
      activeAudio.play().then(function(){
        btn.textContent = '⏸';
        btn.classList.add('playing');
      }).catch(function(err){
        console.error('Erro ao retomar:', err);
      });
    } else {
      activeAudio.pause();
      btn.textContent = '▶';
      btn.classList.remove('playing');
    }
    return;
  }

  if(activeAudio){
    activeAudio.pause();
    if(activeBtn){
      activeBtn.textContent = '▶';
      activeBtn.classList.remove('playing');
    }
  }

  if(!container._audio){
    var audio = new Audio();
    audio.preload = 'auto';
    audio.src = url;

    audio.addEventListener('loadedmetadata', function(){
      var dur = container.querySelector('.audio-duration');
      if(dur) dur.textContent = formatAudioTime(audio.duration);
    });
    audio.addEventListener('timeupdate', function(){
      var fill = container.querySelector('.audio-progress-fill');
      var time = container.querySelector('.audio-time');
      if(fill && audio.duration) fill.style.width = (audio.currentTime/audio.duration*100) + '%';
      if(time) time.textContent = formatAudioTime(audio.currentTime);
    });
    audio.addEventListener('ended', function(){
      btn.textContent = '▶';
      btn.classList.remove('playing');
      var fill = container.querySelector('.audio-progress-fill');
      var time = container.querySelector('.audio-time');
      if(fill) fill.style.width = '0%';
      if(time) time.textContent = '0:00';
    });
    audio.addEventListener('error', function(){
      btn.textContent = '▶';
      btn.classList.remove('playing');
      showAudioError(container, url);
    });
    container._audio = audio;
  }

  var audio2 = container._audio;
  var playPromise = audio2.play();
  if(playPromise !== undefined){
    playPromise.then(function(){
      btn.textContent = '⏸';
      btn.classList.add('playing');
      activeAudio = audio2;
      activeBtn = btn;
    }).catch(function(err){
      console.error('Erro ao tocar:', err);
      btn.textContent = '▶';
      btn.classList.remove('playing');
      showAudioError(container, url);
    });
  }
}

function showAudioError(container, url){
  if(container.querySelector('.audio-error-msg')) return;
  var msg = document.createElement('div');
  msg.className = 'audio-error-msg';
  msg.innerHTML = 'Áudio em breve. Volte em alguns instantes.';
  container.appendChild(msg);
}

function formatAudioTime(s){
  if(!s || isNaN(s) || !isFinite(s)) return '0:00';
  var m = Math.floor(s/60);
  var sec = Math.floor(s%60);
  return m + ':' + (sec<10?'0':'') + sec;
}

function seekAudio(e, bar){
  var container = bar.closest('.custom-audio');
  if(!container || !container._audio) return;
  var audio = container._audio;
  if(!audio.duration || isNaN(audio.duration)) return;
  var rect = bar.getBoundingClientRect();
  var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.currentTime = pct * audio.duration;
}

function copyMsg(btn){
  var item = btn.closest('.msg-item');
  if(!item) return;
  var textEl = item.querySelector('.msg-text');
  if(!textEl) return;
  var text = textEl.textContent.replace(/^"|"$/g, '');
  try {
    navigator.clipboard.writeText(text).then(function(){
      var original = btn.textContent;
      btn.textContent = '✓ Copiado';
      setTimeout(function(){ btn.textContent = original; }, 1500);
    });
  } catch(e) { alert('Não foi possível copiar. Selecione e copie manualmente.'); }
}

document.getElementById('menuBtn').addEventListener('click', function(){ var sb = document.getElementById('sidebar'); if(sb) sb.classList.toggle('open'); });

  var main = document.getElementById('mainContent');

    main.innerHTML = '<div class="error-box"><h2>Erro ao carregar</h2><p>Recarregue a página.</p><button onclick="location.reload()">Recarregar</button></div>';
  }
}
